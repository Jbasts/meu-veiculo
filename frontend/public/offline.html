<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b3440" />
    <title>Sem conexão · Meu Veículo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f3f2;
        color: #16262b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 22rem;
        margin: 1rem;
        padding: 1.5rem;
        border: 1px solid #dde3e3;
        border-radius: 18px;
        background: #fbfcfc;
        text-align: center;
      }
      svg {
        width: 64px;
        height: 64px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0.75rem 0 0.5rem;
      }
      p {
        color: #5b6b70;
        line-height: 1.45;
      }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 0.5rem;
        border: 0;
        border-radius: 14px;
        background: #124c5a;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Desenho do ícone dentro da própria página: sem conexão, nenhum outro arquivo carrega. -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#1b5566" />
        <path d="M18 42a15 15 0 1 1 28 0" fill="none" stroke="#e4a33b" stroke-width="4.5" stroke-linecap="round" />
        <path d="M32 36l7-8" stroke="#e4a33b" stroke-width="4.5" stroke-linecap="round" />
      </svg>
      <h1>Sem conexão com o servidor</h1>
      <p>
        O Meu Veículo precisa falar com o servidor para mostrar e salvar seus dados.
        Confira se o celular está no mesmo Wi-Fi do computador e se o sistema está ligado.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
